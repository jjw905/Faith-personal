name: Deploy Faith to Google Cloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      deploy_worker:
        description: Deploy the analysis worker pool
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: faith-gcp-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  REGION: asia-northeast1
  ARTIFACT_REPOSITORY: faith
  NODE_ENV: production

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AUTH_URL: ${{ vars.FAITH_AUTH_URL || 'http://localhost:3000' }}
      NEXT_SERVER_ACTION_ALLOWED_ORIGINS: ${{ vars.NEXT_SERVER_ACTION_ALLOWED_ORIGINS || 'localhost:3000' }}
      NEXT_PUBLIC_TEAM_FEATURE_ENABLED: ${{ vars.NEXT_PUBLIC_TEAM_FEATURE_ENABLED || 'true' }}
      NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY: ${{ vars.NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY || 'true' }}
      NEXT_PUBLIC_REALTIME_FEATURE_ENABLED: ${{ vars.NEXT_PUBLIC_REALTIME_FEATURE_ENABLED || 'false' }}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Critical-path tests
        run: |
          npm run test:kms-policy
          npm run test:team
          npm run test:meeting-export
          npm run test:process-progress

      - name: Build
        env:
          AUTH_SECRET: ci-only-placeholder-change-me
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-only-placeholder-change-me
          DATABASE_URL: postgresql://faith:faith@127.0.0.1:5432/faith?schema=public
          STORAGE_BACKEND: local
          DURABLE_STATE_BACKEND: local
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      WEB_SERVICE: faith-web-${{ inputs.environment }}
      WORKER_POOL: faith-analysis-${{ inputs.environment }}
      MIGRATION_JOB: faith-migrate-${{ inputs.environment }}
      VERIFY_JOB: faith-verify-${{ inputs.environment }}
      SECRET_PREFIX: faith-${{ inputs.environment }}-
      CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
      WEB_SERVICE_ACCOUNT: ${{ vars.GCP_WEB_RUNTIME_SERVICE_ACCOUNT }}
      WORKER_SERVICE_ACCOUNT: ${{ vars.GCP_WORKER_RUNTIME_SERVICE_ACCOUNT }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      AUTH_URL: ${{ vars.FAITH_AUTH_URL }}
      AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM || 'Faith <onboarding@resend.dev>' }}
      LIVEKIT_URL: ${{ vars.LIVEKIT_URL || '' }}
      LIVEKIT_ENABLED: ${{ vars.LIVEKIT_ENABLED || '0' }}
      MAINTENANCE_CRON_AUDIENCE: ${{ vars.MAINTENANCE_CRON_AUDIENCE || '' }}
      MAINTENANCE_CRON_SERVICE_ACCOUNT: ${{ vars.MAINTENANCE_CRON_SERVICE_ACCOUNT || '' }}
      AUTH_GOOGLE_ID: ${{ vars.AUTH_GOOGLE_ID || '' }}
      AUTH_NAVER_ID: ${{ vars.AUTH_NAVER_ID || '' }}
      AUTH_TWITTER_ID: ${{ vars.AUTH_TWITTER_ID || '' }}
      NEXT_SERVER_ACTION_ALLOWED_ORIGINS: ${{ vars.NEXT_SERVER_ACTION_ALLOWED_ORIGINS }}
      NEXT_PUBLIC_TEAM_FEATURE_ENABLED: ${{ vars.NEXT_PUBLIC_TEAM_FEATURE_ENABLED || 'true' }}
      NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY: ${{ vars.NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY || 'true' }}
      NEXT_PUBLIC_REALTIME_FEATURE_ENABLED: ${{ vars.NEXT_PUBLIC_REALTIME_FEATURE_ENABLED || 'false' }}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_RECAPTCHA_SITE_KEY || '' }}
      WEB_CPU: ${{ vars.CLOUD_RUN_WEB_CPU || '1' }}
      WEB_MEMORY: ${{ vars.CLOUD_RUN_WEB_MEMORY || '1Gi' }}
      WEB_MAX_INSTANCES: ${{ vars.CLOUD_RUN_WEB_MAX_INSTANCES || '10' }}
      WORKER_CPU: ${{ vars.CLOUD_RUN_WORKER_CPU || '2' }}
      WORKER_MEMORY: ${{ vars.CLOUD_RUN_WORKER_MEMORY || '4Gi' }}
      WORKER_INSTANCES: ${{ vars.CLOUD_RUN_WORKER_INSTANCES || '1' }}
      ANALYSIS_WORKER_COUNT: ${{ vars.ANALYSIS_WORKER_COUNT || '2' }}
      GCP_KMS_ENABLED: ${{ vars.GCP_KMS_ENABLED || '0' }}
      GCP_KMS_KEY_RING: ${{ vars.GCP_KMS_KEY_RING || format('faith-{0}', inputs.environment) }}
      GCP_KMS_CONTENT_KEY: ${{ vars.GCP_KMS_CONTENT_KEY || format('faith-{0}-content', inputs.environment) }}
      GCP_KMS_AUDIT_KEY: ${{ vars.GCP_KMS_AUDIT_KEY || format('faith-{0}-audit', inputs.environment) }}
      GCP_KMS_TEAM_KEY_RING: ${{ vars.GCP_KMS_TEAM_KEY_RING || format('faith-{0}-teams', inputs.environment) }}
      GCP_KMS_RUNTIME_ENV: ${{ inputs.environment }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build and push Docker image
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/faith:${GITHUB_SHA}"
          gcloud builds submit . \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --config=cloudbuild.yaml \
            --substitutions="^@^_IMAGE=${IMAGE}@_SERVER_ACTIONS_SECRET=${SECRET_PREFIX}server-actions-key@_NEXT_SERVER_ACTION_ALLOWED_ORIGINS=${NEXT_SERVER_ACTION_ALLOWED_ORIGINS}@_NEXT_PUBLIC_TEAM_FEATURE_ENABLED=${NEXT_PUBLIC_TEAM_FEATURE_ENABLED}@_NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY=${NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY}@_NEXT_PUBLIC_REALTIME_FEATURE_ENABLED=${NEXT_PUBLIC_REALTIME_FEATURE_ENABLED}@_NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Require an existing worker pool for web-only deploys
        if: ${{ !inputs.deploy_worker }}
        run: |
          set -euo pipefail
          gcloud run worker-pools describe "${WORKER_POOL}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" >/dev/null
          echo "Existing worker pool found; confirm it has at least one active instance before promotion."

      - name: Deploy web service image
        run: |
          set -euo pipefail
          test -n "${GCP_PROJECT_ID}"
          test -n "${GCS_BUCKET}"
          test -n "${AUTH_URL}"
          test -n "${WEB_SERVICE_ACCOUNT}"
          test -n "${CLOUD_SQL_INSTANCE}"
          test -n "${NEXT_SERVER_ACTION_ALLOWED_ORIGINS}"
          test -n "${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}"
          test -n "${MAINTENANCE_CRON_AUDIENCE}"
          test -n "${MAINTENANCE_CRON_SERVICE_ACCOUNT}"
          case "${LIVEKIT_ENABLED}" in
            0) ;;
            1)
              test -n "${LIVEKIT_URL}"
              case "${LIVEKIT_URL}" in
                wss://*) ;;
                *) echo "LIVEKIT_URL must use wss:// when LiveKit is enabled" >&2; exit 1 ;;
              esac
              ;;
            *) echo "LIVEKIT_ENABLED must be 0 or 1" >&2; exit 1 ;;
          esac
          case "${AUTH_URL}" in
            https://*) ;;
            *) echo "FAITH_AUTH_URL must use https:// in GCP deployments" >&2; exit 1 ;;
          esac

          RUNTIME_SECRETS="AUTH_SECRET=${SECRET_PREFIX}auth-secret:latest,SETUP_SECRET=${SECRET_PREFIX}setup-secret:latest,ADMIN_SEED_PASSWORD=${SECRET_PREFIX}admin-seed-password:latest,ADMIN_EMAILS=${SECRET_PREFIX}admin-emails:latest,NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${SECRET_PREFIX}server-actions-key:latest,DATABASE_URL=${SECRET_PREFIX}database-url:latest,OPENAI_API_KEY=${SECRET_PREFIX}openai-api-key:latest,NOTIFICATION_ENC_KEY=${SECRET_PREFIX}notification-key:latest,AUTH_RESEND_KEY=${SECRET_PREFIX}resend-key:latest,RECAPTCHA_SECRET_KEY=${SECRET_PREFIX}recaptcha-secret:latest"
          if [[ "${LIVEKIT_ENABLED}" == "1" ]]; then
            RUNTIME_SECRETS+=",LIVEKIT_API_KEY=${SECRET_PREFIX}livekit-api-key:latest,LIVEKIT_API_SECRET=${SECRET_PREFIX}livekit-api-secret:latest"
          fi
          if [[ -n "${AUTH_GOOGLE_ID}" ]]; then
            RUNTIME_SECRETS+=",AUTH_GOOGLE_SECRET=${SECRET_PREFIX}google-client-secret:latest"
          fi
          if [[ -n "${AUTH_TWITTER_ID}" ]]; then
            RUNTIME_SECRETS+=",AUTH_TWITTER_SECRET=${SECRET_PREFIX}twitter-client-secret:latest"
          fi

          gcloud run deploy "${WEB_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --image="${IMAGE}" \
            --cpu="${WEB_CPU}" \
            --memory="${WEB_MEMORY}" \
            --timeout=300 \
            --concurrency=40 \
            --min-instances=0 \
            --max-instances="${WEB_MAX_INSTANCES}" \
            --no-traffic \
            --allow-unauthenticated \
            --service-account="${WEB_SERVICE_ACCOUNT}" \
            --add-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
            --set-env-vars="^|^NODE_ENV=${NODE_ENV}|AUTH_URL=${AUTH_URL}|NEXT_PUBLIC_APP_URL=${AUTH_URL}|AUTH_EMAIL_FROM=${AUTH_EMAIL_FROM}|AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}|AUTH_NAVER_ID=${AUTH_NAVER_ID}|AUTH_TWITTER_ID=${AUTH_TWITTER_ID}|LIVEKIT_ENABLED=${LIVEKIT_ENABLED}|LIVEKIT_URL=${LIVEKIT_URL}|MAINTENANCE_CRON_AUDIENCE=${MAINTENANCE_CRON_AUDIENCE}|MAINTENANCE_CRON_SERVICE_ACCOUNT=${MAINTENANCE_CRON_SERVICE_ACCOUNT}|NEXT_PUBLIC_TEAM_FEATURE_ENABLED=${NEXT_PUBLIC_TEAM_FEATURE_ENABLED}|NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY=${NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY}|NEXT_PUBLIC_REALTIME_FEATURE_ENABLED=${NEXT_PUBLIC_REALTIME_FEATURE_ENABLED}|NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}|STORAGE_BACKEND=gcs|DURABLE_STATE_BACKEND=database|GCP_PROJECT_ID=${GCP_PROJECT_ID}|GCS_BUCKET=${GCS_BUCKET}|GCS_SIGNED_URL_TTL_SECONDS=600|ANALYSIS_EXECUTION_MODE=queue|ANALYSIS_WORKER_COUNT=${ANALYSIS_WORKER_COUNT}|GCP_KMS_ENABLED=${GCP_KMS_ENABLED}|GCP_KMS_LOCATION=${REGION}|GCP_KMS_RUNTIME_ENV=${GCP_KMS_RUNTIME_ENV}|GCP_KMS_KEY_RING=${GCP_KMS_KEY_RING}|GCP_KMS_CONTENT_KEY=${GCP_KMS_CONTENT_KEY}|GCP_KMS_AUDIT_KEY=${GCP_KMS_AUDIT_KEY}|GCP_KMS_TEAM_KEY_RING=${GCP_KMS_TEAM_KEY_RING}|NEXT_SERVER_ACTION_ALLOWED_ORIGINS=${NEXT_SERVER_ACTION_ALLOWED_ORIGINS}|TRUST_PROXY=1" \
            --set-secrets="${RUNTIME_SECRETS}"

      - name: Apply Prisma migrations
        run: |
          set -euo pipefail
          test -n "${WORKER_SERVICE_ACCOUNT}"
          test -n "${CLOUD_SQL_INSTANCE}"
          SERVICE_IMAGE="$(gcloud run services describe "${WEB_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(spec.template.spec.containers[0].image)')"
          test -n "${SERVICE_IMAGE}"
          echo "SERVICE_IMAGE=${SERVICE_IMAGE}" >> "${GITHUB_ENV}"

          gcloud run jobs deploy "${MIGRATION_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --image="${SERVICE_IMAGE}" \
            --service-account="${WORKER_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
            --cpu=1 \
            --memory=512Mi \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --command="npm" \
            --args="run,db:migrate" \
            --set-env-vars="NODE_ENV=production" \
            --set-secrets="DATABASE_URL=${SECRET_PREFIX}database-url:latest" \
            --execute-now \
            --wait

      - name: Verify GCP runtime configuration
        run: |
          set -euo pipefail
          VERIFY_SECRETS="DATABASE_URL=${SECRET_PREFIX}database-url:latest,AUTH_SECRET=${SECRET_PREFIX}auth-secret:latest,SETUP_SECRET=${SECRET_PREFIX}setup-secret:latest,ADMIN_EMAILS=${SECRET_PREFIX}admin-emails:latest,NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${SECRET_PREFIX}server-actions-key:latest,OPENAI_API_KEY=${SECRET_PREFIX}openai-api-key:latest,AUTH_RESEND_KEY=${SECRET_PREFIX}resend-key:latest,RECAPTCHA_SECRET_KEY=${SECRET_PREFIX}recaptcha-secret:latest,NOTIFICATION_ENC_KEY=${SECRET_PREFIX}notification-key:latest"
          if [[ "${LIVEKIT_ENABLED}" == "1" ]]; then
            VERIFY_SECRETS+=",LIVEKIT_API_KEY=${SECRET_PREFIX}livekit-api-key:latest,LIVEKIT_API_SECRET=${SECRET_PREFIX}livekit-api-secret:latest"
          fi
          gcloud run jobs deploy "${VERIFY_JOB}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --image="${SERVICE_IMAGE}" \
            --service-account="${WORKER_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances="${CLOUD_SQL_INSTANCE}" \
            --cpu=1 \
            --memory=512Mi \
            --tasks=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --command="npm" \
            --args="run,test:gcp-runtime" \
            --set-env-vars="^|^NODE_ENV=production|AUTH_URL=${AUTH_URL}|LIVEKIT_ENABLED=${LIVEKIT_ENABLED}|LIVEKIT_URL=${LIVEKIT_URL}|MAINTENANCE_CRON_AUDIENCE=${MAINTENANCE_CRON_AUDIENCE}|MAINTENANCE_CRON_SERVICE_ACCOUNT=${MAINTENANCE_CRON_SERVICE_ACCOUNT}|NEXT_SERVER_ACTION_ALLOWED_ORIGINS=${NEXT_SERVER_ACTION_ALLOWED_ORIGINS}|NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${NEXT_PUBLIC_RECAPTCHA_SITE_KEY}|NEXT_PUBLIC_REALTIME_FEATURE_ENABLED=${NEXT_PUBLIC_REALTIME_FEATURE_ENABLED}|STORAGE_BACKEND=gcs|DURABLE_STATE_BACKEND=database|GCP_PROJECT_ID=${GCP_PROJECT_ID}|GCS_BUCKET=${GCS_BUCKET}|GCP_KMS_ENABLED=${GCP_KMS_ENABLED}|GCP_KMS_RUNTIME_ENV=${GCP_KMS_RUNTIME_ENV}|GCP_KMS_LOCATION=${REGION}|GCP_KMS_KEY_RING=${GCP_KMS_KEY_RING}|GCP_KMS_CONTENT_KEY=${GCP_KMS_CONTENT_KEY}|GCP_KMS_AUDIT_KEY=${GCP_KMS_AUDIT_KEY}|GCP_KMS_TEAM_KEY_RING=${GCP_KMS_TEAM_KEY_RING}" \
            --set-secrets="${VERIFY_SECRETS}" \
            --execute-now \
            --wait

      - name: Reuse Docker image for analysis worker pool
        if: ${{ inputs.deploy_worker }}
        run: |
          set -euo pipefail
          test -n "${SERVICE_IMAGE}"
          echo "WORKER_IMAGE=${SERVICE_IMAGE}" >> "${GITHUB_ENV}"

      - name: Deploy analysis worker pool
        if: ${{ inputs.deploy_worker }}
        run: |
          set -euo pipefail
          test -n "${WORKER_SERVICE_ACCOUNT}"
          PROJECT_NUMBER="$(gcloud projects describe "${GCP_PROJECT_ID}" \
            --format='value(projectNumber)')"
          cat > worker-pool.yaml <<EOF
          apiVersion: run.googleapis.com/v1
          kind: WorkerPool
          metadata:
            name: ${WORKER_POOL}
            namespace: "${PROJECT_NUMBER}"
            labels:
              cloud.googleapis.com/location: ${REGION}
            annotations:
              run.googleapis.com/manualInstanceCount: "${WORKER_INSTANCES}"
              run.googleapis.com/scalingMode: manual
          spec:
            template:
              metadata:
                annotations:
                  run.googleapis.com/cloudsql-instances: "${CLOUD_SQL_INSTANCE}"
              spec:
                serviceAccountName: ${WORKER_SERVICE_ACCOUNT}
                containers:
                - name: analysis-worker
                  image: ${WORKER_IMAGE}
                  command:
                  - npm
                  args:
                  - run
                  - analysis:workers
                  env:
                  - name: NODE_ENV
                    value: "${NODE_ENV}"
                  - name: STORAGE_BACKEND
                    value: gcs
                  - name: DURABLE_STATE_BACKEND
                    value: database
                  - name: GCP_PROJECT_ID
                    value: "${GCP_PROJECT_ID}"
                  - name: GCS_BUCKET
                    value: "${GCS_BUCKET}"
                  - name: ANALYSIS_EXECUTION_MODE
                    value: queue
                  - name: ANALYSIS_WORKER_COUNT
                    value: "${ANALYSIS_WORKER_COUNT}"
                  - name: ANALYSIS_WORKER_POLL_MS
                    value: "1000"
                  - name: GCP_KMS_ENABLED
                    value: "${GCP_KMS_ENABLED}"
                  - name: GCP_KMS_LOCATION
                    value: "${REGION}"
                  - name: GCP_KMS_RUNTIME_ENV
                    value: "${GCP_KMS_RUNTIME_ENV}"
                  - name: GCP_KMS_KEY_RING
                    value: "${GCP_KMS_KEY_RING}"
                  - name: GCP_KMS_CONTENT_KEY
                    value: "${GCP_KMS_CONTENT_KEY}"
                  - name: GCP_KMS_AUDIT_KEY
                    value: "${GCP_KMS_AUDIT_KEY}"
                  - name: GCP_KMS_TEAM_KEY_RING
                    value: "${GCP_KMS_TEAM_KEY_RING}"
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: ${SECRET_PREFIX}database-url
                        key: latest
                  - name: OPENAI_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: ${SECRET_PREFIX}openai-api-key
                        key: latest
                  - name: NOTIFICATION_ENC_KEY
                    valueFrom:
                      secretKeyRef:
                        name: ${SECRET_PREFIX}notification-key
                        key: latest
                  resources:
                    limits:
                      cpu: "${WORKER_CPU}"
                      memory: "${WORKER_MEMORY}"
          EOF
          gcloud run worker-pools replace worker-pool.yaml \
            --project="${GCP_PROJECT_ID}"

      - name: Promote web revision after migration
        run: |
          set -euo pipefail
          gcloud run services update-traffic "${WEB_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --to-latest

      - name: Smoke-test promoted web health
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${WEB_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${REGION}" \
            --format='value(status.url)')"
          test -n "${SERVICE_URL}"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "${SERVICE_URL}/api/health/auth"
