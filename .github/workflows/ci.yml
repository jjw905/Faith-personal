name: Faith CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: faith-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-only-placeholder-change-me
  DATABASE_URL: postgresql://faith:faith@127.0.0.1:5432/faith?schema=public
  STORAGE_BACKEND: local
  DURABLE_STATE_BACKEND: local
  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ci-only-next-server-actions-key-32
  NEXT_SERVER_ACTION_ALLOWED_ORIGINS: localhost:3000
  NEXT_PUBLIC_TEAM_FEATURE_ENABLED: true
  NEXT_PUBLIC_TEAM_FEATURE_ADMIN_ONLY: true
  NEXT_PUBLIC_REALTIME_FEATURE_ENABLED: false
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ""

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject tracked secrets
        run: npm run security:secrets

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Critical-path tests
        run: |
          npm run test:kms-policy
          npm run test:team
          npm run test:meeting-export
          npm run test:process-progress

      - name: Build
        run: npm run build
