steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        docker pull "${_BASE_IMAGE}"
        docker pull "${_CACHE_IMAGE}" || true
        DOCKER_BUILDKIT=1 docker build \
          --cache-from "${_CACHE_IMAGE}" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg BASE_IMAGE="${_BASE_IMAGE}" \
          -f Dockerfile.worker \
          -t "${_IMAGE}" \
          -t "${_CACHE_IMAGE}" \
          .

images:
  - ${_IMAGE}
  - ${_CACHE_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
  # E2_HIGHCPU_8는 프로젝트 쿼터에 막히는 경우가 있어 기본 머신으로 둔다.
  # 느리면 timeout(40분) 안에서 끝난다.

timeout: 2400s
